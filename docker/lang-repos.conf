# YanPub 语言后端 Git 仓库配置
# 格式: lang_id  git_url  子目录(相对于仓库根)
#   子目录为 . 表示适配器路径就是仓库根
#   子目录为 yan/ 表示适配器路径在仓库内的 yan/ 子目录
#
# deploy.sh sync 读取此文件自动 clone 语言项目
# 注意: 此文件仅含 gitcode 镜像。
#       完整镜像配置（含 github/internal）见根目录 languages.yaml
#       deploy.sh 支持 REPO_SOURCE=gitcode|github|internal|auto 切换

