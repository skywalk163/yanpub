# languages.yaml - 言埠语言配置中心
#
# 单一真源：所有语言的本地路径、仓库镜像、Docker 构建信息。
# 被 deploy.sh（sync/build）、_path_resolver.py（开发路径解析）共同读取。
#
# 仓库镜像选择策略：
#   环境变量 REPO_SOURCE 控制使用哪个镜像：
#     auto      自动检测（默认）：尝试 GitHub 3s 超时，失败则用 GitCode
#     gitcode   固定使用 GitCode（国内推荐）
#     github    固定使用 GitHub（海外推荐）
#     internal  固定使用内网 Gitea（仅局域网可用）
#
# 国内/国外自动判断逻辑（auto 模式）：
#   1. 先尝试连接 github.com（3s 超时）
#   2. 连通 → 使用 github 镜像（海外环境）
#   3. 超时/失败 → 使用 gitcode 镜像（国内环境）

# ── 镜像优先级 ──────────────────────────────────────────
mirror_priority:
  # 国内：优先内网，其次 GitCode，最后 GitHub
  domestic: [internal, gitcode, github]
  # 海外：优先 GitHub，其次 GitCode
  overseas: [github, gitcode, internal]

# ── 语言列表 ────────────────────────────────────────────
languages:
