  duan:
    name: 段言
    name_en: Duan
    version: "1.3.8"
    extensions: [".段", ".duan"]
    env_var: DUAN_DIR
    local_dir: "G:\\dumategithub\\duan"
    repos:
      gitcode: "https://gitcode.com/skywalk163/duan.git"
      github: "https://github.com/skywalk163/duan.git"
    docker:
      subdir: "."
      install: "pip install --no-cache-dir -e ."
    colors:
      primary: "#E85D3A"
      secondary: "#FFB347"
      accent: "#2C3E50"

