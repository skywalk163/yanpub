# YanPub — 一键部署
# docker compose up -d 即可启动
#
# 首次部署（从 gitcode 拿到 yanpub 后）:
#   1. ./deploy.sh sync    — 自动 git clone 11 种语言后端
#   2. ./deploy.sh build   — 构建 Docker 镜像
#   3. ./deploy.sh up      — 启动服务
#
# 自定义构建:
#   PYTHON_IMAGE=python:3.12-slim docker compose build  # 使用官方镜像
#   INSTALL_RACKET=1 docker compose build                # 启用明道语言(Racket)
#   INSTALL_LLVM=1 docker compose build                  # 启用翰语JIT(LLVM)
#   YANPUB_PORT=9090 docker compose up -d                # 自定义端口
#
# 服务器内存配置:
#   2GB 内存: 默认配置即可（容器限 900MB，留余量给系统）
#   4GB+ 内存: 可调大 YANPUB_MEMORY_LIMIT 环境变量
#   排查 OOM: docker inspect yanpub --format='{{.State.OOMKilled}}'

services:
  yanpub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Python 基础镜像，默认使用国内加速镜像
        # 能直连 Docker Hub 时可改为: python:3.12-slim
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        # 可选: 安装 Racket 运行时（明道语言需要，约 250MB）
        INSTALL_RACKET: ${INSTALL_RACKET:-0}
        # 可选: 安装 LLVM/clang（翰语 JIT 原生执行，约 400MB；默认 Python 回退）
        INSTALL_LLVM: ${INSTALL_LLVM:-0}
    container_name: yanpub
    ports:
      - "${YANPUB_PORT:-8080}:8080"
    environment:
      - YANPUB_LANG_DIR=/opt/langs
      # 安全限制（可通过 .env 覆盖）
      - YANPUB_MAX_CONCURRENT_EXEC=${YANPUB_MAX_CONCURRENT_EXEC:-3}
      - YANPUB_EXEC_RATE_LIMIT=${YANPUB_EXEC_RATE_LIMIT:-5}
      - YANPUB_WS_EXEC_RATE_LIMIT=${YANPUB_WS_EXEC_RATE_LIMIT:-15}
    # 资源限制 — 防止单个容器耗尽主机资源导致机器假死
    # 2GB 服务器: 容器限 900MB，给系统+Docker daemon 留 ~1.1GB
    # 4GB+ 服务器: 通过 YANPUB_MEMORY_LIMIT 环境变量调大
    deploy:
      resources:
        limits:
          cpus: '${YANPUB_CPU_LIMIT:-2.0}'
          memory: ${YANPUB_MEMORY_LIMIT:-900M}
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    # 健康检查 — 低配机器启动慢，给更长的宽限期
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/languages"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
