# YanPub — 一键部署
# docker compose up -d 即可启动
#
# 首次部署（从 gitcode 拿到 yanpub 后）:
#   1. ./deploy.sh sync    — 自动 git clone 11 种语言后端
#   2. ./deploy.sh build   — 构建 Docker 镜像
#   3. ./deploy.sh up      — 启动服务
#
# 自定义构建:
#   PYTHON_IMAGE=python:3.12-slim docker compose build  # 使用官方镜像
#   INSTALL_RACKET=1 docker compose build                # 启用明道语言(Racket)
#   INSTALL_LLVM=1 docker compose build                  # 启用翰语JIT(LLVM)
#   YANPUB_PORT=9090 docker compose up -d                # 自定义端口

services:
  yanpub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Python 基础镜像，默认使用国内加速镜像
        # 能直连 Docker Hub 时可改为: python:3.12-slim
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        # 可选: 安装 Racket 运行时（明道语言需要，约 250MB）
        INSTALL_RACKET: ${INSTALL_RACKET:-0}
        # 可选: 安装 LLVM/clang（翰语 JIT 原生执行，约 400MB；默认 Python 回退）
        INSTALL_LLVM: ${INSTALL_LLVM:-0}
    container_name: yanpub
    ports:
      - "${YANPUB_PORT:-8080}:8080"
    environment:
      - YANPUB_LANG_DIR=/opt/langs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/languages"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
